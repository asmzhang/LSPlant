plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.asmzx.android_attack_defense_test'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.asmzx.android_attack_defense_test"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "armeabi-v7a", "arm64-v8a"//, "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('../app/JunkZapNew.jks')
            storePassword 'ruisen2048'
            keyAlias 'key0'
            keyPassword 'ruisen2048'
        }
        release {
            storeFile file('../app/JunkZapNew.jks')
            storePassword 'ruisen2048'
            keyAlias 'key0'
            keyPassword 'ruisen2048'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation project(':testmod')

    debugImplementation project(':helper:build-srcdebug')
    releaseImplementation project(':helper:build-prefab')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}