pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "LSPlant"
include ':lsplant:build-prefab'
include ':lsplant:build-standalone'
include ':lsplant:build-srcdebug'
include ':helper:build-prefab'
include ':helper:build-standalone'
include ':helper:build-srcdebug'
include ':app'
include ':testmod'