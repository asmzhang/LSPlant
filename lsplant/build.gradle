plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    compileSdk rootProject.ext.androidCompileSdkVersion
    ndkVersion rootProject.ext.androidNdkVersion
    buildToolsVersion rootProject.ext.androidBuildToolsVersion

    buildFeatures {
        buildConfig false
        androidResources false

        prefabPublishing true
        prefab true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 不再排除所有.so文件，确保lsplant.so能够被打包到输出中
    packaging {
        jniLibs {
            // 移除对所有.so文件的排除
            // exclude "**/*.so"
        }
    }

    prefab {
        register("lsplant") {
            headers = "src/main/jni/include"
        }
    }

    defaultConfig {
//        applicationId "org.lsposed.lsplant"
        minSdk rootProject.ext.androidMinSdkVersion
        targetSdk rootProject.ext.androidTargetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        minSdk = androidMinSdkVersion
        externalNativeBuild {
            cmake {
                    cFlags "-Werror", "-Wno-gnu-string-literal-operator-template"
                    cppFlags "-Werror", "-Wno-gnu-string-literal-operator-template"
                    abiFilters "armeabi-v7a", "arm64-v8a"//, "x86", "x86_64", "riscv64"
                    // 确保 lsplant 始终编译动态库
                    arguments "-DLSPLANT_BUILD_SHARED=ON",
                            "-DANDROID_STL=c++_static"
                }
        }
    }

    buildTypes {
        standalone {
            initWith release
            matchingFallbacks += "release"
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_STL=c++_static",
                            "-DLSPLANT_STANDALONE=ON",
                            "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                            "-DDEBUG_SYMBOLS_PATH=${project.layout.buildDirectory.file("symbols/standalone").get().asFile.absolutePath}",
                            "-DANDROID_CPP_FEATURES=exceptions;rtti"
                }
            }
        }
        debug {
            // 启用调试信息
            debuggable true
            // 禁用代码优化，便于调试
            minifyEnabled false
            // 禁用资源收缩
            shrinkResources false
            // 启用断言
            // debuggable true // Already set above
            // 保留所有调试信息
            packaging {
                jniLibs {
                    // 保留调试符号
                    keepDebugSymbols += "**/*.so"
                }
            }
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                            "-DANDROID_STL=c++_static",
                            "-DDEBUG_SYMBOLS_PATH=${project.layout.buildDirectory.file("symbols/debug").get().asFile.absolutePath}",
                            // 禁用C/C++优化
                            "-DCMAKE_BUILD_TYPE=Debug",
                            // 启用C/C++断言
                            "-DANDROID_CPP_FEATURES=exceptions;rtti"
                    // 设置调试级别为详细
                    cppFlags += "-g3 -O0"
                    cFlags += "-g3 -O0"
                }
            }
        }
        release {
            // 禁用调试信息
            debuggable false
            // 禁用代码优化
            minifyEnabled false
            // 禁用资源收缩
            shrinkResources false
            // 禁用断言
            debuggable false
            // 移除调试符号以减小大小
            packaging {
                jniLibs {
                    // 可以选择保留或移除调试符号
                    // keepDebugSymbols += "**/*.so"
                }
            }
            externalNativeBuild {
                cmake {
                    arguments  "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                            "-DANDROID_STL=c++_static",
                            "-DDEBUG_SYMBOLS_PATH=${project.layout.buildDirectory.file("symbols/release").get().asFile.absolutePath}",
                            // 启用C/C++优化
                            "-DCMAKE_BUILD_TYPE=Release",
                            // 启用C/C++异常和RTTI
                            "-DANDROID_CPP_FEATURES=exceptions;rtti"
                    // 设置优化级别为最高
                    cppFlags += "-O3"
                    cFlags += "-O3"
                }
            }
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = false
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
            version rootProject.ext.androidCmakeVersion
        }
    }
    namespace = "org.lsposed.lsplant"

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
        singleVariant("standalone") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    //https://github.com/asmzhang/libcxx.git
    standaloneCompileOnly 'org.lsposed.libcxx:libcxx:29.0.13599879'
    //https://github.com/asmzhang/LSP-Dobby.git
    implementation 'io.github.vvb2060.ndk:dobby:1.2'
}

task generateReleaseSymbolsJar(type: Jar) {
    from project.layout.buildDirectory.file("symbols/release")
    exclude "**/dex_builder"
    archiveClassifier = "symbols"
    archiveBaseName = "release"
}

task generateStandaloneSymbolsJar(type: Jar) {
    from project.layout.buildDirectory.file("symbols/standalone")
    exclude "**/dex_builder"
    archiveClassifier = "symbols"
    archiveBaseName = "standalone"
}

// 硬编码版本号，不再从外部Git仓库获取
def ver = "6.5.0"
println "${rootProject.name} version: $ver"

// Use standard Maven publishing instead of custom publish plugin for now
publishing {
    publications {
        lsplant(MavenPublication) {
            groupId = "org.lsposed.lsplant"
            artifactId = "lsplant"
            version = ver
            afterEvaluate {
                from components.release
                artifact generateReleaseSymbolsJar
            }
            pom {
                name = "LSPlant"
                description = "A hook framework for Android Runtime (ART)"
                url = "https://github.com/LSPosed/LSPlant"
                licenses {
                    license {
                        name = "GNU Lesser General Public License v3.0"
                        url = "https://github.com/LSPosed/LSPlant/blob/master/LICENSE"
                    }
                }
                developers {
                    developer {
                        name = "Lsposed"
                        url = "https://lsposed.org"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/LSPosed/LSPlant.git"
                    url = "https://github.com/LSPosed/LSPlant"
                }
            }
        }
        lsplantStandalone(MavenPublication) {
            groupId = "org.lsposed.lsplant"
            artifactId = "lsplant-standalone"
            version = ver
            afterEvaluate {
                from components.standalone
                artifact generateStandaloneSymbolsJar
            }
            pom {
                name = "LSPlant"
                description = "A hook framework for Android Runtime (ART)"
                url = "https://github.com/LSPosed/LSPlant"
                licenses {
                    license {
                        name = "GNU Lesser General Public License v3.0"
                        url = "https://github.com/LSPosed/LSPlant/blob/master/LICENSE"
                    }
                }
                developers {
                    developer {
                        name = "Lsposed"
                        url = "https://lsposed.org"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/LSPosed/LSPlant.git"
                    url = "https://github.com/LSPosed/LSPlant"
                }
            }
        }
    }
}